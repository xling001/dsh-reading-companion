name: test

# 这个仓库是"零依赖 + 无构建"的：没有 npm 依赖要装，测试直接跑 Node 内置 test runner。
# 所以 CI 里**没有 install 步骤**，这也是本插件能在 DSH 里热改即生效的前提。
#
# 覆盖 Node 22 / 24 两档，因为 package.json 的 engines 同时允许两者，
# 而编码探测与字节区间那部分用的是 Buffer API，值得跨大版本钉一次。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19', '24']
    name: node ${{ matrix.node }} @ ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 不跑 pnpm/npm install：本包 dependencies 为空。
      #
      # ⚠️ **不要在这里加 `--test-isolation=none`。** 它能让所有测试共享一个进程、
      # 本地跑得快些，但那个开关**在 Node 22.19 上还不存在** —— 加了它，CI 会在
      # 22.19 两档上以**退出码 9（Invalid Argument）**在 1 秒内失败。
      # v2.0.4 首发时就是这么红的：Node 24 两档全绿、22.19 两档全红，注解只有
      # 一句 "Process completed with exit code 9"。
      # CI 用默认的"每个测试文件一个进程"完全没问题；只有**受限沙箱**
      # （不能 spawn 子进程）才需要那个开关，见 README 里的 `npm run test:no-isolation`。
      #
      # 刻意**不设** DSH_APP_NODE_MODULES：CI 上没有 DSH，
      # cordis-integration 会走它默认的"找不到就跳过"分支。
      # 设成空串反而可能被当成一个真实路径。
      - name: unit + integration tests
        run: node --test

  # ⭐ 真宿主契约：**只在手动触发时**跑（Actions 页面的 "Run workflow"）。
  #
  # 为什么要单独一条作业：主矩阵刻意**零安装**（见上面那段注释），而这一条必须联网
  # 装一份**同版本的官方内核包**当夹具 —— 那 3 条 `cordis-integration` 用例是**唯一**
  # 能碰到宿主真实 API 的覆盖（inject 名字写错、`section()` 形状不对、`guard` 语义理解错，
  # 表现都是"插件静默等待"，**全绿也看不出来**）。
  # 2026-11-23 之前它们在 CI 上**永远是 skip**（宿主装进 asar 之后磁盘上再没有可 import 的包）。
  #
  # ⚠️ 下面那串版本号**必须跟着内核走**：它测的是"我们在真实内核上装得起来"，
  #    版本不对就成了测另一个内核。内核升级时一起改（桌面壳的版本见日志 `dsh: 0.2.x`）。
  host-contract:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: 真宿主契约（官方内核夹具）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 装同版本内核包当夹具
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-host-fixture"
          cd "$RUNNER_TEMP/dsh-host-fixture"
          npm init -y >/dev/null
          npm i --no-audit --no-fund --no-package-lock \
            @deepseek-ai/cordis@4.1.0 \
            @deepseek-ai/dsh-tools@0.2.2-rc.5 \
            @deepseek-ai/dsh-system-prompt@0.2.2-rc.5 \
            @deepseek-ai/dsh-workspace@0.2.2-rc.5 \
            @deepseek-ai/dsh-client-ui-theme@0.2.2-rc.5

      # ⚠️ **跑完还要断言"它没有 skip"** —— 夹具没生效时这条测试是**静默跳过**的，
      # 而"跳过"和"通过"在 CI 界面上都是绿色，这正是这个洞此前存在五周的原因。
      - name: 跑真宿主契约，并断言没有 skip
        env:
          DSH_APP_NODE_MODULES: ${{ runner.temp }}/dsh-host-fixture/node_modules
        run: |
          set -o pipefail
          node --test test/cordis-integration.test.mjs | tee "$RUNNER_TEMP/host-contract.log"
          if grep -q 'skipped 3' "$RUNNER_TEMP/host-contract.log"; then
            echo "::error::夹具没生效 —— 3 条用例又 skip 了，等于零覆盖"
            exit 1
          fi